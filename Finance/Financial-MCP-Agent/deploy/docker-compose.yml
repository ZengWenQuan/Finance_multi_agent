version: "2.4"

# ============================================================
#  Financial MCP Agent — 分布式部署
#
#  服务拓扑：
#    [浏览器] → nginx:80 → /api/* → backend:8000
#                        → /      → 静态前端文件
#
#  注意：MCP Server 通过 stdio 子进程与 backend 通信，
#  不是独立网络服务，因此与 backend 合并在同一容器内
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Python 后端（FastAPI + LangChain + MCP stdio subproc）
  # ----------------------------------------------------------
  backend:
    build:
      context: ..           # Financial-MCP-Agent 项目根
      dockerfile: deploy/Dockerfile.backend
    image: financial-mcp-backend:latest
    container_name: fmcp_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env             # OPENAI_COMPATIBLE_* 等密钥
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - MCP_SERVER_DIR=/app/mcp_server   # 对应 volumes 里挂载的路径
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
    volumes:
      - ../data:/app/data                   # SQLite 数据库持久化
      - ../reports:/app/reports             # Markdown 报告输出
      - ../logs:/app/logs                   # 运行日志
      - mcp_server_src:/app/mcp_server      # MCP 服务器源码（只读挂载）
    depends_on:
      - neo4j
    expose:
      - "8000"              # 只在内部网络暴露，不对外
    networks:
      - fmcp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------
  # 2. Nginx 反向代理 + 静态前端
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: fmcp_nginx
    restart: unless-stopped
    ports:
      - "8890:80"             # 改为 8890，避免防火墙或默认 80 端口占用
      # - "443:443"         # 有域名时打开，配合 SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro   # 静态前端文件
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fmcp_net

  # ----------------------------------------------------------
  # 3. Neo4j 图数据库
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5.12.0
    container_name: fmcp_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"         # HTTP 可视化面板
      - "7687:7687"         # Bolt 协议
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - ../data/neo4j:/data
    networks:
      - fmcp_net

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  mcp_server_src:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/irving/workspace/agent_demo/Finance/a-share-mcp-is-just-i-need

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  fmcp_net:
    driver: bridge
