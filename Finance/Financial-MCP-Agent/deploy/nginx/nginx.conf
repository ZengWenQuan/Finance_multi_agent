server {
    listen 80;
    server_name _;
    charset utf-8;

    # ============================================================
    #  动静分离说明
    #
    #  静态资源（nginx 直接响应，带缓存头，不转发后端）：
    #    /           → index.html
    #    /assets/*   → styles.css / app.js（7天强缓存）
    #
    #  动态请求（nginx 反向代理到 backend:8000）：
    #    /api/*      → FastAPI，不缓存，支持流式响应
    # ============================================================

    # ----------------------------------------------------------
    # 动态：/api/* → python backend（不缓存）
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # 动态请求明确禁止缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # 流式响应支持（analysis 异步任务 / chat）
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------------------------
    # 静态：/assets/* → 直接读取 nginx html 目录（用 alias）
    #   注意：不能用 rewrite + root，会路径翻倍
    #   正确做法：alias 把 /assets/ 映射到 html 根目录
    # ----------------------------------------------------------
    location /assets/ {
        alias  /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # 静态：/ → index.html（SPA 入口，短缓存）
    # ----------------------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # html 不缓存（防止更新后浏览器用旧版本）
        add_header Cache-Control "no-cache";
    }

    # 错误页
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
